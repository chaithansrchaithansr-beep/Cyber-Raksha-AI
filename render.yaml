services:
  # 1. Cyber Raksha AI - Python FastAPI Backend
  - type: web
    name: cyber-raksha-backend
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: "pip install --upgrade pip && pip install -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DEMO_MODE
        value: "True"
      - key: DATABASE_URL
        value: "sqlite+aiosqlite:///cyber_raksha.db"
      - key: SECRET_KEY
        generateValue: true
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "1440"
      - key: CORS_ORIGINS
        value: '["*"]'

  # 2. Cyber Raksha AI - React Vite Frontend (Static Site)
  - type: web
    name: cyber-raksha-frontend
    runtime: static
    rootDir: frontend
    plan: free
    buildCommand: "npm install && npm run build"
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: cyber-raksha-backend
          property: host
